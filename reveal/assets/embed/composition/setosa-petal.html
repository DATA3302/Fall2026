<!doctype html>
<link rel="stylesheet" href="lib/figure.css" />
<div id="fig"></div>
<script type="module">
    // Reference: the right half of the "+" slide — mean petalWidth for setosa alone. Same x, a y
    // range an order of magnitude smaller.
    import { setosaSeries, xScale, line, drawXAxis, d3, svgRoot, drawAxis, chartFrame, axisTitle } from "./lib/setosa.js";
    import { blue } from "./lib/chart.js";

    const { petal } = await setosaSeries();
    const width = 720, height = 560;
    const margin = { top: 24, right: 34, bottom: 62, left: 92 };
    const x = xScale(margin.left, width - margin.right);
    const y = d3.scaleLinear().domain([0, 0.4]).range([height - margin.bottom, margin.top]);

    const svg = svgRoot(width, height);
    svg.append("path").attr("d", line(x, y)(petal))
        .style("fill", "none").style("stroke", blue).style("stroke-width", 2.8);

    chartFrame(svg, x, y);
    drawXAxis(svg, x, width, margin, height);
    drawAxis(svg, d3.axisLeft(y).ticks(8).tickFormat(d3.format(".2f")), `translate(${margin.left},0)`);
    axisTitle(svg, "Mean of petalWidth", { x: 26, y: (margin.top + height - margin.bottom) / 2, rotate: -90 });
    fig.append(svg.node());
</script>
