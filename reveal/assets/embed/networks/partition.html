<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="stylesheet" href="lib/figure.css" />
        <link rel="stylesheet" href="lib/demos.css" />
        <link rel="stylesheet" href="lib/hierarchy-motion.css" />
    </head>
    <body class="motion">
        <header>
            <span id="summary" role="status" aria-live="polite"
                >Loading Flare…</span
            >
        </header>
        <main>
            <svg
                aria-label="Flare hierarchy, animated between rectangular and radial partitions"
                role="img"
            ></svg>
        </main>
        <div class="controls" aria-label="Layout controls">
            <button id="icicle" aria-pressed="true">Icicle</button
            ><button id="sunburst" aria-pressed="false">Sunburst</button
            ><button id="reset">Reset</button>
        </div>
        <p class="caption">
            <a
                href="https://github.com/d3/d3-hierarchy/blob/main/test/data/flare.json"
                target="_blank"
                rel="noopener"
                >Source data ↗</a
            >. Hover a region for its full path and size.
        </p>
        <script src="../geospatial/lib/d3.min.js"></script>
        <script type="module" src="lib/partition.js"></script>
    </body>
</html>
