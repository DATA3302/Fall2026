<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Annotation — local D3 recreation</title>
    <link rel="stylesheet" href="../geospatial/lib/figure.css">
    <style>
        main { inset: 0 0 62px; }
        .reference { width: 100%; height: 100%; object-fit: contain; }
        [hidden] { display: none !important; }
        .caption { bottom: 39px; }
        @media print { .controls, .caption, #recreation { display: none !important; } .reference { display: block !important; } }
    </style>
</head>
<body>
    <main>
        <img class="reference" src="../../images/temporal/page-34-annotation.svg" alt="Original source vector chart: three-point attempts per game, annotated with the shorter three-point line and Steph Curry's first All-Star season.">
        <div id="recreation" hidden style="width:100%;height:100%"></div>
    </main>
    <p class="caption">Local D3: recovered source mark positions, not original numeric observations.</p>
    <div class="controls" aria-label="Annotation example controls">
        <button type="button" data-mode="static" aria-pressed="true">Static</button>
        <button type="button" data-mode="local" aria-pressed="false">Local D3</button>
        <label><input id="annotations" type="checkbox" checked disabled>Annotations</label>
    </div>
    <p class="sr-only" role="status" aria-live="polite">Static source reference selected.</p>
    <script src="../geospatial/lib/d3.min.js"></script>
    <script type="module" src="annotation.js"></script>
</body>
</html>
