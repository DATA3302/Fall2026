<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Mercator: Extreme</title>
        <link rel="stylesheet" href="lib/figure.css" />
    </head>
    <body
        class="external"
        data-mode="static"
        data-live-src="https://mrgris.com/projects/merc-extreme/"
        data-live-title="Mercator: Extreme — external interactive map"
        data-live-allow="fullscreen; geolocation"
    >
        <main>
            <img
                class="external-static"
                src="fallback/mercator-extreme.png"
                alt="Static reference: original Mercator: Extreme distorted map centered near Boston, without slide headings."
            />
        </main>
        <div class="controls" aria-label="External page controls">
            <button type="button" data-mode="static" aria-pressed="true">
                Static</button
            ><button type="button" data-mode="live" aria-pressed="false">
                Live</button
            
            ><a
                href="https://mrgris.com/projects/merc-extreme/"
                target="_blank"
                rel="noopener noreferrer"
                >Open Mercator: Extreme ↗</a
            >
        </div>
        <p class="sr-only" role="status" aria-live="polite"></p>
        <script type="module" src="lib/external.js"></script>
    </body>
</html>
