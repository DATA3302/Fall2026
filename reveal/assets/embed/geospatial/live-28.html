<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Unfolding the Earth</title>
        <link rel="stylesheet" href="lib/figure.css" />
    </head>
    <body
        class="external"
        data-mode="static"
        data-live-src="https://www.youtube.com/embed/b1xXTi1nFCo"
        data-live-title="Unfolding the Earth — Myriahedral projections, Jack van Wijk"
        data-live-allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    >
        <main>
            <img
                class="external-static"
                src="fallback/unfolding.svg"
                alt="Static reference: four original Unfolding the Earth projection frames in reading order, arranged two by two; not video playback."
            />
        </main>
        <div class="controls" aria-label="External video controls">
            <button type="button" data-mode="static" aria-pressed="true">
                Static</button
            ><button type="button" data-mode="live" aria-pressed="false">
                Live</button
            
            ><a
                href="https://www.youtube.com/watch?v=b1xXTi1nFCo"
                target="_blank"
                rel="noopener noreferrer"
                >Open video ↗</a
            >
        </div>
        <p class="sr-only" role="status" aria-live="polite"></p>
        <script type="module" src="lib/external.js"></script>
    </body>
</html>
