<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Jason Davies maps</title>
        <link rel="stylesheet" href="lib/figure.css" />
    </head>
    <body
        class="external"
        data-mode="static"
        data-live-src="https://www.jasondavies.com/maps/"
        data-live-title="Jason Davies — map projections gallery"
    >
        <main>
            <img
                class="external-static"
                src="fallback/jasondavies.svg"
                alt="Static reference: six original projection panels in reading order, arranged three by two, retaining source artwork and labels."
            />
        </main>
        <div class="controls" aria-label="External page controls">
            <button type="button" data-mode="static" aria-pressed="true">
                Static</button
            ><button type="button" data-mode="live" aria-pressed="false">
                Live</button
            
            ><a
                href="https://www.jasondavies.com/maps/"
                target="_blank"
                rel="noopener noreferrer"
                >Open maps ↗</a
            >
        </div>
        <p class="sr-only" role="status" aria-live="polite"></p>
        <script type="module" src="lib/external.js"></script>
    </body>
</html>
