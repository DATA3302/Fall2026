<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Census Dots</title>
        <link rel="stylesheet" href="lib/figure.css" />
    </head>
    <body
        class="external"
        data-mode="static"
        data-live-src="https://www.censusdots.com/?map=14,35.2816,-120.6420"
        data-live-title="Census Dots — San Luis Obispo"
    >
        <main>
            <img
                class="external-static"
                src="fallback/censusdots.png"
                alt="Static reference: original Census Dots map of San Luis Obispo with its demographic legend."
            />
        </main>
        <div class="controls" aria-label="External page controls">
            <button type="button" data-mode="static" aria-pressed="true">
                Static</button
            ><button type="button" data-mode="live" aria-pressed="false">
                Live</button
            
            ><a
                href="https://www.censusdots.com/?map=14,35.2816,-120.6420"
                target="_blank"
                rel="noopener noreferrer"
                >Open Census Dots ↗</a
            >
        </div>
        <p class="sr-only" role="status" aria-live="polite"></p>
        <script type="module" src="lib/external.js"></script>
    </body>
</html>
