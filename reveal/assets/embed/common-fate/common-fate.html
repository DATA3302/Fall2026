<!doctype html>
<div id="fig">
    <div class="fig-controls">
        <label for="animate-input">Animate</label>
        <input id="animate-input" type="checkbox" />
        <label for="reveal-input">Reveal</label>
        <input id="reveal-input" type="checkbox" />
    </div>
</div>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // Common fate: a subset of dots is visually identical to the rest at rest, and only
    // pops out as a group once it moves together in a shared direction while the
    // distractors drift independently.
    function mulberry32(a) {
        return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    const rand = mulberry32(42);

    const width = 900;
    const height = 500;
    const r = 5;
    const n = 400;

    // The "group" traces a ring shape; everyone else is scattered uniformly.
    const groupCount = 26;
    const cx = width / 2;
    const cy = height / 2;
    const ringR = 130;

    const nodes = d3.range(n).map((i) => {
        if (i < groupCount) {
            const a = (i / groupCount) * 2 * Math.PI;
            return {
                group: true,
                restX: cx + ringR * Math.cos(a),
                restY: cy + ringR * Math.sin(a),
                angle: a,
            };
        }
        return {
            group: false,
            restX: 40 + rand() * (width - 80),
            restY: 40 + rand() * (height - 80),
            dx: (rand() - 0.5) * 40,
            dy: (rand() - 0.5) * 40,
        };
    });

    const svg = d3
        .create("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height]);

    const circles = svg
        .append("g")
        .selectAll("circle")
        .data(nodes)
        .join("circle")
        .attr("cx", (d) => d.restX)
        .attr("cy", (d) => d.restY)
        .attr("r", r)
        .attr("fill", "#495057");

    fig.append(svg.node());

    let t = 0;
    let timer = null;

    function frame() {
        t += 0.045;
        circles
            .attr("cx", (d) =>
                d.group
                    ? cx +
                      (ringR + Math.sin(t * 1.6) * 14) * Math.cos(d.angle + t)
                    : d.restX + Math.sin(t + d.dx) * 10,
            )
            .attr("cy", (d) =>
                d.group
                    ? cy +
                      (ringR + Math.sin(t * 1.6) * 14) * Math.sin(d.angle + t)
                    : d.restY + Math.cos(t + d.dy) * 10,
            );
    }

    d3.select("#animate-input").on("change", function () {
        if (this.checked) {
            timer = d3.interval(frame, 30);
        } else {
            // Just stop where they are — no snap back to restX/restY — so unchecking mid-motion
            // freezes the current frame instead of resetting the scene.
            timer?.stop();
        }
    });

    d3.select("#reveal-input").on("change", function () {
        circles.attr("fill", (d) =>
            this.checked && d.group ? "#c2255c" : "#495057",
        );
    });
</script>
