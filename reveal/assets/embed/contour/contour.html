<!doctype html>
<div id="fig">
    <div class="fig-controls">
        <label for="bin-input"> Number of color levels</label>
        <input
            id="bin-input"
            type="range"
            value="100"
            min="1"
            max="100"
            step="1"
        />
        <br />
    </div>
</div>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    const data = await d3.json("volcano.json");

    var levels = 100;

    const n = data.width;
    const m = data.height;
    const width = 928;
    const height = Math.round((m / n) * width);
    const path = d3.geoPath().projection(d3.geoIdentity().scale(width / n));
    const contours = d3.contours().size([n, m]);

    const color = d3
        .scaleSequential(d3.interpolateTurbo)
        .domain(d3.extent(data.values))
        .nice();

    const svg = d3
        .create("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height]);

    let chart = svg
        .append("g")
        .attr("stroke", "none")
        .selectAll()
        .data(color.ticks(levels))
        .join("path")
        .attr("d", (d) => path(contours.contour(data.values, d)))
        .attr("fill", color);

    fig.append(svg.node());

    function changeBins() {
        chart = chart
            .data(color.ticks(this.value))
            .join("path")
            .attr("d", (d) => path(contours.contour(data.values, d)))
            .attr("fill", color);
    }
    d3.select("#bin-input").on("input", changeBins);
</script>
