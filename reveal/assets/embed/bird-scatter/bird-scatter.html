<!doctype html>
<div id="fig">
    <div class="fig-controls">
        <label for="color-toggle">Color</label>
        <input id="color-toggle" type="checkbox" />
        <br />
        <label for="shape-toggle">Shape</label>
        <input id="shape-toggle" type="checkbox" />
        <br />

        <label for="weight-toggle">Weight</label>
        <input id="weight-toggle" type="checkbox" />
    </div>
</div>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // Synthetic stand-in for Ware's shearwater/gull/tern beak-length vs. beak-width
    // dataset (Information Visualization: Perception for Design, Ch. 5): three species
    // clusters that overlap enough that shape alone forces a slow, serial search, while
    // color lets the eye pop the cluster boundaries out pre-attentively. "Weight" is a
    // deliberately mismatched third channel — a plus mark for terns and a gaussian blur
    // on gulls — to contrast a well-chosen categorical encoding against a poor one.
    function mulberry32(a) {
        return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    const rand = mulberry32(7);
    const species = [
        {
            name: "Shearwaters",
            symbol: d3.symbolCircle,
            cx: 30,
            cy: 30,
            spread: 7,
        },
        { name: "Gulls", symbol: d3.symbolSquare, cx: 25, cy: 45, spread: 10 },
        {
            name: "Terns",
            symbol: d3.symbolTriangle,
            cx: 40,
            cy: 40,
            spread: 15,
        },
    ];
    const color = d3
        .scaleOrdinal()
        .domain(species.map((d) => d.name))
        .range(["#c2255c", "#2f9e44", "#1971c2"]);

    const data = species.flatMap((s) =>
        d3.range(24).map(() => ({
            species: s.name,
            symbol: s.symbol,
            x: s.cx + (rand() - 0.5) * s.spread * 2,
            y: s.cy + (rand() - 0.5) * s.spread * 2,
        })),
    );

    const width = 900;
    const height = 500;
    const margin = { top: 25, right: 25, bottom: 25, left: 25 };

    const x = d3
        .scaleLinear()
        .domain([10, 60])
        .range([margin.left, width - margin.right]);
    const y = d3
        .scaleLinear()
        .domain([10, 60])
        .range([height - margin.bottom, margin.top]);

    const svg = d3
        .create("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height])
        .attr("font-family", "var(--slide-font, sans-serif)");

    // Wide filter region so the blur doesn't clip against the default -10%/120% bounds.
    svg.append("defs")
        .append("filter")
        .attr("id", "gull-blur")
        .attr("x", "-100%")
        .attr("y", "-100%")
        .attr("width", "300%")
        .attr("height", "300%")
        .append("feGaussianBlur")
        .attr("stdDeviation", 2.2);

    // svg.append("g")
    //     .attr("transform", `translate(0,${height - margin.bottom})`)
    //     .call(d3.axisBottom(x).ticks(6))
    //     .call((g) => g.selectAll("text").attr("font-size", 15))
    //     .append("text")
    //     .attr("x", (width - margin.left - margin.right) / 2 + margin.left)
    //     .attr("y", 44)
    //     .attr("fill", "currentColor")
    //     .attr("font-size", 18)
    //     .attr("text-anchor", "middle")
    //     .text("Beak length");

    // svg.append("g")
    //     .attr("transform", `translate(${margin.left},0)`)
    //     .call(d3.axisLeft(y).ticks(6))
    //     .call((g) => g.selectAll("text").attr("font-size", 15))
    //     .append("text")
    //     .attr("transform", "rotate(-90)")
    //     .attr("x", -(height - margin.top - margin.bottom) / 2 - margin.top)
    //     .attr("y", -46)
    //     .attr("fill", "currentColor")
    //     .attr("font-size", 18)
    //     .attr("text-anchor", "middle")
    //     .text("Beak width");

    const point = svg
        .append("g")
        .selectAll("path")
        .data(data)
        .join("path")
        .attr("transform", (d) => `translate(${x(d.x)},${y(d.y)})`)
        .attr("stroke", "#1a1a1a")
        .attr("stroke-width", 1)
        .attr("stroke-opacity", 0.5);

    // const legend = svg
    //     .append("g")
    //     .attr(
    //         "transform",
    //         `translate(${width - margin.right - 150},${margin.top})`,
    //     )
    //     .selectAll("g")
    //     .data(species)
    //     .join("g")
    //     .attr("transform", (_, i) => `translate(0,${i * 26})`);

    // legend
    //     .append("path")
    //     .attr("d", (d) => d3.symbol(d.symbol, 110)())
    //     .attr("transform", "translate(8,0)")
    //     .attr("stroke", "#1a1a1a")
    //     .attr("stroke-width", 1)
    //     .attr("stroke-opacity", 0.5);

    // legend
    //     .append("text")
    //     .attr("x", 22)
    //     .attr("y", 5)
    //     .attr("font-size", 16)
    //     .text((d) => d.name);

    fig.append(svg.node());

    // Shape and weight are alternative ways of differentiating species by mark, so only
    // one can be on at a time; color is an independent channel and can combine with
    // either (or neither). Weight always draws terns as a plus and blurs gulls,
    // regardless of what `symbol` a species would otherwise use.
    function markFor(d, useShape, useWeight) {
        if (useWeight) {
            return d.species === "Terns" || d.name === "Terns"
                ? d3.symbolPlus
                : d3.symbolCircle;
        }
        return useShape ? d.symbol : d3.symbolCircle;
    }

    function render() {
        const useColor = colorToggle.checked;
        const useShape = shapeToggle.checked;
        const useWeight = weightToggle.checked;

        point
            .attr("d", (d) =>
                d3.symbol(
                    markFor(d, useShape, useWeight),
                    useWeight && d.species === "Terns" ? 170 : 130,
                )(),
            )
            .attr("fill", (d) => (useColor ? color(d.species) : "#495057"))
            .attr("stroke-width", (d) =>
                useWeight && d.species === "Terns" ? 1.6 : 1,
            )
            .attr("filter", (d) =>
                useWeight && d.species === "Gulls" ? "url(#gull-blur)" : null,
            );

        legend
            .selectAll("path")
            .attr("d", (d) =>
                d3.symbol(
                    markFor(d, useShape, useWeight),
                    useWeight && d.name === "Terns" ? 150 : 110,
                )(),
            )
            .attr("fill", (d) => (useColor ? color(d.name) : "#495057"))
            .attr("stroke-width", (d) =>
                useWeight && d.name === "Terns" ? 1.6 : 1,
            )
            .attr("filter", (d) =>
                useWeight && d.name === "Gulls" ? "url(#gull-blur)" : null,
            );
    }

    const colorToggle = document.getElementById("color-toggle");
    const shapeToggle = document.getElementById("shape-toggle");
    const weightToggle = document.getElementById("weight-toggle");

    colorToggle.addEventListener("change", render);
    shapeToggle.addEventListener("change", () => {
        if (shapeToggle.checked) weightToggle.checked = false;
        render();
    });
    weightToggle.addEventListener("change", () => {
        if (weightToggle.checked) shapeToggle.checked = false;
        render();
    });

    render();
</script>
