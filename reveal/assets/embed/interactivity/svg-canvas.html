<!doctype html>
<link rel="stylesheet" href="lib/figure.css" />
<div id="fig"></div>
<script type="module">
    // The SVG coordinate system: origin top-left, x to the right, y DOWN.
    //   ?step=0  the canvas and its axes
    //   ?step=1  a circle placed at (width, 0) is cut off by the canvas edge
    //   ?step=2  the same circle placed at (width - margin, 0 + margin)
    import { d3, ink, serif, orange, canvasFill, params, mono } from "./lib/common.js";

    const s = +(params.get("step") ?? 0);
    const width = 460, height = 460, pad = 90;
    const W = 300, H = 300, r = 22, margin = 34;
    const svg = d3.create("svg").attr("viewBox", [0, 0, width, height]).attr("width", width).attr("height", height)
        .style("font-family", serif);
    svg.append("defs").append("marker").attr("id", "arrow").attr("viewBox", "0 0 10 10").attr("refX", 5).attr("refY", 5)
        .attr("markerWidth", 4).attr("markerHeight", 4).attr("orient", "auto-start-reverse")
        .append("path").attr("d", "M0,0L10,5L0,10z").style("fill", orange);

    const canvas = svg.append("g").attr("transform", `translate(${pad},${pad})`);
    canvas.append("clipPath").attr("id", "clip").append("rect").attr("width", W).attr("height", H);
    canvas.append("rect").attr("width", W).attr("height", H).style("fill", canvasFill);
    if (s >= 1) {
        const [cx, cy] = s === 1 ? [W, 0] : [W - margin, 0 + margin];
        canvas.append("circle").attr("clip-path", "url(#clip)").attr("cx", cx).attr("cy", cy).attr("r", r).style("fill", ink);
    }
    const axis = (x2, y2) => canvas.append("line").attr("x1", 0).attr("y1", 0).attr("x2", x2).attr("y2", y2)
        .style("stroke", orange).style("stroke-width", 7).attr("marker-end", "url(#arrow)");
    axis(W * 0.36, 0);
    axis(0, H * 0.36);
    const label = (x, y, t, anchor = "start") => canvas.append("text").attr("x", x).attr("y", y).attr("text-anchor", anchor)
        .style("fill", orange).style("font-weight", 600).style("font-size", "24px").text(t);
    label(-10, -16, "(0,0)", "end");
    label(W * 0.18, 30, "x-axis", "middle");
    label(10, H * 0.25, "y-axis");
    fig.append(svg.node());
</script>
