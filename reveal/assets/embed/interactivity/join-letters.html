<!doctype html>
<link rel="stylesheet" href="lib/figure.css" />
<div id="fig"></div>
<script type="module">
    // The general update pattern (after Mike Bostock's example): every 1.5 s a new random,
    // alphabetized subset of letters is joined to the <text> elements, keyed by the letter itself.
    //   ?transition=0  the slide's code exactly: enter appends, update keeps, exit removes
    //   ?transition=1  the same join with animated enter (drop in, green), update (slide over),
    //                  and exit (fall out, red), as on the animation slide
    import {
        d3,
        ink,
        serif,
        green,
        red,
        params,
        addButton,
    } from "./lib/common.js";

    const animate = params.get("transition") === "1";
    const width = 520,
        height = 60;
    const svg = d3
        .create("svg")
        .attr("viewBox", [0, -18, width, height])
        .attr("width", width)
        .attr("height", height)
        .style("font-family", serif)
        .style("font-size", "18px")
        .style("fill", ink);
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const randomLetters = () =>
        d3
            .shuffle(alphabet.slice())
            .slice(0, Math.floor(6 + Math.random() * 20))
            .sort(d3.ascending);

    let text = svg.selectAll("text");

    function update(letters) {
        if (!animate) {
            text = text
                .data(letters, (d) => d)
                .join(
                    (enter) =>
                        enter
                            .append("text")
                            .attr("y", 17)
                            .attr("dy", "0.35em")
                            .text((d) => d),
                    (update) => update,
                    (exit) => exit.remove(),
                )
                .attr("x", (d, i) => i * 17);
            return;
        }
        const t = svg.transition().duration(750);
        text = text
            .data(letters, (d) => d)
            .join(
                (enter) =>
                    enter
                        .append("text")
                        .style("fill", green)
                        .attr("x", (d, i) => i * 17)
                        .attr("y", -20)
                        .attr("dy", "0.35em")
                        .text((d) => d)
                        .call((enter) => enter.transition(t).attr("y", 17)),
                (update) =>
                    update
                        .style("fill", ink)
                        .attr("y", 17)
                        .call((update) =>
                            update.transition(t).attr("x", (d, i) => i * 17),
                        ),
                (exit) =>
                    exit
                        .style("fill", red)
                        .call((exit) =>
                            exit.transition(t).attr("y", 50).remove(),
                        ),
            );
    }

    fig.append(svg.node());
    update(randomLetters());
    let timer = setInterval(() => update(randomLetters()), 1500);
</script>
