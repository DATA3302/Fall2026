<!doctype html>
<link rel="stylesheet" href="lib/figure.css" />
<div id="fig"></div>
<script type="module">
    // Animation as a sequence of graphics on a timeline. ?states=a,b picks which states this slide
    // steps through with the arrow keys:
    //   0 "draw" every frame on top of the last (marks pile up)
    //   1 "draw" then "clear" between frames
    //   2 only the first and last frames are keyframes ("draw", "transition")
    //   3 the frames between are generated by "tweening / easing"
    import { d3, ink, muted, blue, orange, serif, mono, canvasFill, params, stepper } from "./lib/common.js";

    const list = (params.get("states") ?? "0,1").split(",").map(Number);
    const step = stepper(list.length);
    const width = 1000, height = 330, n = 5, F = 110, gap = 74, x0 = 40, fy = 70;
    const svg = d3.create("svg").attr("viewBox", [0, 0, width, height]).attr("width", width).attr("height", height)
        .style("font-family", mono);
    const pos = (i) => [14 + i * 20, 92 - i * 16]; // the dot's path through the frames

    svg.append("defs").append("marker").attr("id", "arr").attr("viewBox", "0 0 10 10").attr("refX", 9).attr("refY", 5)
        .attr("markerWidth", 7).attr("markerHeight", 7).attr("orient", "auto").append("path").attr("d", "M0,0L10,5L0,10z").style("fill", ink);
    svg.append("line").attr("x1", 20).attr("x2", width - 20).attr("y1", 290).attr("y2", 290)
        .style("stroke", ink).style("stroke-width", 4).attr("marker-end", "url(#arr)");

    const frames = svg.selectAll("g.frame").data(d3.range(n)).join("g").attr("class", "frame")
        .attr("transform", (i) => `translate(${x0 + i * (F + gap)},${fy})`);
    const stem = frames.append("line").attr("x1", F / 2).attr("x2", F / 2).attr("y1", F + 30).attr("y2", 220).style("stroke-width", 4);
    const knob = frames.append("circle").attr("cx", F / 2).attr("cy", F + 30).attr("r", 8);
    const box = frames.append("rect").attr("width", F).attr("height", F).style("fill", canvasFill).style("stroke-width", 4);
    const dots = frames.selectAll("circle.dot").data((i) => d3.range(i + 1).map((j) => ({ i, j }))).join("circle")
        .attr("class", "dot").attr("r", 9).style("fill", blue)
        .attr("cx", (d) => pos(d.j)[0]).attr("cy", (d) => pos(d.j)[1]);
    const label = frames.append("text").attr("x", F / 2).attr("y", -14).attr("text-anchor", "middle").style("font-size", "20px");
    const clears = svg.selectAll("text.clear").data(d3.range(n - 1)).join("text").attr("class", "clear")
        .attr("x", (i) => x0 + (i + 1) * (F + gap) - gap / 2).attr("y", 200).attr("text-anchor", "middle")
        .style("font-size", "20px").style("fill", ink).text("clear");
    const tween = svg.append("text").attr("x", x0 + 2 * (F + gap) + F / 2).attr("y", fy - 14).attr("text-anchor", "middle")
        .style("font-size", "20px").style("fill", muted).text("tweening / easing");

    function render(k) {
        const s = list[k];
        const key = (i) => s >= 2 && (i === 0 || i === n - 1);
        const color = (i) => (key(i) ? orange : s >= 2 ? muted : ink);
        dots.style("opacity", (d) => (s === 0 || d.j === d.i ? 1 : 0));
        box.style("stroke", (i) => (key(i) ? orange : "none"));
        stem.style("stroke", color);
        knob.style("fill", color);
        label.style("fill", (i) => (key(i) ? orange : ink))
            .text((i) => (s < 2 ? "draw" : i === 0 ? "draw" : i === n - 1 ? "transition" : ""));
        clears.style("opacity", s === 1 ? 1 : 0);
        tween.style("opacity", s === 3 ? 1 : 0);
    }

    fig.append(svg.node());
    step.set(render);
</script>
