title: "DATA 3302 — Data Visualization"
short_title: "DATA 3302"
description: "Course website for Cal Poly DATA 3302: Data Visualization."
course_number: DATA 3302
institution: California Polytechnic State University, San Luis Obispo
url: "https://data3302.github.io/"
baseurl: "/Fall2026"
lang: en
logo: /assets/images/logo.png
favicon: /assets/images/logo.png
theme_color: "#154f3b"

markdown: kramdown
kramdown:
  input: GFM
permalink: pretty

exclude:
  - .bundle
  - Gemfile
  - Gemfile.lock
  - README.md
  - content/tmp
  - reveal/README.md
  - vendor

sass:
  style: compressed

# Interactive Reveal.js decks (see reveal/README.md) live in their own collection,
# nested under reveal/ so their source and everything they load stays separate from
# the site's own pages/layouts and from the static PDF course content in content/.
collections_dir: reveal
collections:
  decks:
    output: true
    permalink: /slides/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: decks
    values:
      layout: deck
