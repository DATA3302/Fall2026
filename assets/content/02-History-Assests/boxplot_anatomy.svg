<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="EB Garamond, Georgia, serif">
  <rect x="0" y="0" width="900" height="400" fill="#fffff8"/>

  <!-- landmarks: min 2, Q1 3.5, median 6.1, Q3 9.6, max 15 -->
  <!-- x(v) = 80 + (v-1) * 52.857 -->

  <!-- whiskers -->
  <line x1="133" y1="220" x2="212" y2="220" stroke="#242421" stroke-width="2"/>
  <line x1="535" y1="220" x2="820" y2="220" stroke="#242421" stroke-width="2"/>
  <line x1="133" y1="196" x2="133" y2="244" stroke="#242421" stroke-width="2"/>
  <line x1="820" y1="196" x2="820" y2="244" stroke="#242421" stroke-width="2"/>

  <!-- box -->
  <rect x="212" y="170" width="323" height="100" fill="#176b4d" fill-opacity="0.12" stroke="#242421" stroke-width="2.5"/>
  <line x1="350" y1="170" x2="350" y2="270" stroke="#176b4d" stroke-width="4"/>

  <!-- axis -->
  <line x1="60" y1="330" x2="840" y2="330" stroke="#d8d4c8" stroke-width="1.5"/>

  <!-- landmark ticks + labels -->
  <g font-size="20" fill="#242421" text-anchor="middle">
    <line x1="133" y1="244" x2="133" y2="330" stroke="#d8d4c8" stroke-width="1.5"/>
    <text x="133" y="110" font-weight="bold">2</text>
    <text x="133" y="136" font-size="16" fill="#77746d">Minimum</text>

    <line x1="212" y1="170" x2="212" y2="330" stroke="#d8d4c8" stroke-width="1.5"/>
    <text x="212" y="70" font-weight="bold">3.5</text>
    <text x="212" y="96" font-size="16" fill="#77746d">Lower quartile</text>

    <line x1="350" y1="170" x2="350" y2="330" stroke="#d8d4c8" stroke-width="1.5"/>
    <text x="350" y="40" font-weight="bold" fill="#176b4d">6.1</text>
    <text x="350" y="66" font-size="16" fill="#176b4d">Median</text>

    <line x1="535" y1="170" x2="535" y2="330" stroke="#d8d4c8" stroke-width="1.5"/>
    <text x="535" y="70" font-weight="bold">9.6</text>
    <text x="535" y="96" font-size="16" fill="#77746d">Upper quartile</text>

    <line x1="820" y1="244" x2="820" y2="330" stroke="#d8d4c8" stroke-width="1.5"/>
    <text x="820" y="110" font-weight="bold">15</text>
    <text x="820" y="136" font-size="16" fill="#77746d">Maximum</text>
  </g>

  <text x="60" y="365" font-size="16" fill="#77746d" font-style="italic">Data: 2, 3, 3.5, 4.2, 6.1, 7.8, 9.6, 12, 15</text>
</svg>
